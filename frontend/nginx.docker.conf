server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── API → backend ────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts generosos para operaciones lentas (SMTP puede tardar 10-15s)
        proxy_connect_timeout 10s;
        proxy_send_timeout    90s;
        proxy_read_timeout    90s;
    }

    # ── Contenido dinámico CMS (posts, imágenes) desde volumen compartido ────
    location /posts/ {
        root /data/content;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ── projects.json dinámico desde volumen compartido ──────────────────────
    location = /projects.json {
        root /data/content;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # ── Sitemap y robots ─────────────────────────────────────────────────────
    location = /sitemap.xml {
        root /data/content;
        add_header Content-Type "application/xml";
        try_files $uri =404;
    }

    location = /robots.txt {
        add_header Content-Type "text/plain";
        try_files $uri =404;
    }

    # ── index.html: nunca cachear ─────────────────────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ── Assets con hash (JS/CSS): caché larga, son inmutables ────────────────
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── Otros estáticos sin hash ──────────────────────────────────────────────
    location ~* \.(ico|svg|woff|woff2|ttf|eot|png|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── React Router: cualquier ruta → index.html ────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
