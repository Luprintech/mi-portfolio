name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ──────────────────────────────────────────
  # Job 1: Frontend — lint, test, build
  # ──────────────────────────────────────────
  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # ──────────────────────────────────────────
  # Job 2: Backend — test (sin lint formal)
  # ──────────────────────────────────────────
  backend:
    name: Backend (test)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      # Variables mínimas para que los tests pasen sin DB real
      JWT_SECRET: ci-test-jwt-secret
      CMS_USERNAME: ci-admin
      CMS_PASSWORD: ci-password
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test (Vitest)
        run: npm test

      - name: Syntax check
        run: npm run check
