server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Blog posts: nunca cachear
    location /posts/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # index.html: nunca cachear
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets con hash (JS, CSS, imágenes): caché larga, son inmutables
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Otros estáticos sin hash (favicon, fuentes, etc.)
    location ~* \.(ico|svg|woff|woff2|ttf|eot|png|jpg|jpeg|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: cualquier ruta desconocida → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}